name: Deploy

# Deploys the consolidated onym.app stack (Caddy + strfry + blossom +
# relayer + the three moderation services) to DigitalOcean by running
# deploy/digitalocean/deploy.sh with config sourced from repo
# Secrets/Variables instead of a local .env.
# Manual trigger only — infra changes should be deliberate.
#
# Required repository SECRETS:
#   DO_API_KEY          DigitalOcean API token
#   CF_API_TOKEN        Cloudflare token with DNS:Edit on the onym.app zone
#   SSH_PRIVATE_KEY     Private key the droplet is created with / trusts
#   RELAYER_SECRET_KEY  Stellar secret key (S...)
#   RELAYER_AUTH_TOKENS (optional) comma-separated bearer tokens
#
# Moderation SECRETS:
#   MODERATION_DEVICECHECK_KEY_PEM   Contents of AuthKey_<KEYID>.p8, newlines as \n
#   MODERATION_DEVICECHECK_KEY_ID    10-character DeviceCheck key id
#   MODERATION_DEVICECHECK_TEAM_ID   10-character Apple team id
#   MODERATION_INTERFACE_SIGNING_SEED  64 hex chars (openssl rand -hex 32)
#   AUTHORITY_SIGNING_SEED           64 hex chars. Never rotate it while bans
#                                    run — verdicts already issued stop verifying
#   MODERATION_AUTHORITY_TOKEN       Shared bearer token for POST /v1/verdicts.
#                                    The SAME value is the authority's
#                                    AUTHORITY_INTERFACE_TOKEN — one secret, two files
#   AUTHORITY_MODERATOR_TOKEN        (optional) bearer token for the JSON decision API
#   AUTHORITY_ADMIN_TOKEN            Required while triage is off: bearer token for the
#                                    human decision and appeal panel at /admin
#   MODERATION_AUDIT_TOKEN           (optional) bearer token for GET /v1/write-log
#
# Android moderation SECRETS (the Play Integrity sibling — a separate
# interface with its own credentials; see moderation-android.env.example):
#   MODERATION_PLAY_SA_KEY_JSON      Google Cloud service-account JSON key of the
#                                    project linked in Play Console, one line.
#                                    Empty is valid: the service boots degraded and
#                                    every gate check answers checkRequired — the
#                                    expected state until device-recall access lands
#   MODERATION_ANDROID_INTERFACE_SIGNING_SEED  64 hex chars, DIFFERENT from the
#                                    Apple interface's seed (deploy.sh enforces it)
#   MODERATION_ANDROID_AUTHORITY_TOKEN  REQUIRED (the job fails without it): bearer
#                                    token the authority presents on the Android
#                                    backend's POST /v1/verdicts. Written into the
#                                    authority's AUTHORITY_INTERFACE_ROUTES entry —
#                                    one secret, two files, same pattern as
#                                    MODERATION_AUTHORITY_TOKEN
#   MODERATION_ANDROID_AUDIT_TOKEN   (optional) bearer for its GET /v1/write-log
#
# Repository VARIABLES (optional — defaults shown in the workflow):
#   DOMAIN, NOSTR_HOST, BLOSSOM_HOST, RELAYER_HOST, CADDY_EMAIL,
#   DO_REGION, DO_DROPLET_SIZE
#   MODERATION_HOST, AUTHORITY_HOST
#   DOCR_NAME           DigitalOcean container registry to build into and
#                       pull from. Set it and the runner builds the four
#                       images (skipping any whose submodule commit is
#                       already built) and the droplet only pulls. Empty
#                       keeps the old behaviour: sources rsynced and four
#                       Rust builds run on the droplet itself. Uses
#                       DO_API_KEY — no additional secret
#   MODERATION_DEVICECHECK_ENV       production | development
#   MODERATION_INTERFACE_KEY_EPOCHS  Per-authority countersigning epochs,
#                                    <componentId>=<epoch> comma separated. Empty
#                                    until an authority's key is rotated; bumping
#                                    one entry rotates only that relationship
#   MODERATION_ENFORCE_SIGNATURES    Defaults true. Set false only as an
#                                    explicit, temporary diagnostic override;
#                                    it lets the shared token mark devices
#                                    without a verifiable verdict
#   AUTHORITY_INTERFACE_KEY          The interface's PUBLIC countersigning key,
#                                    onym:key:<hex>. It is derived from
#                                    MODERATION_INTERFACE_SIGNING_SEED and does not
#                                    exist until the interface has booted once, so it
#                                    is a variable rather than a secret: leave it
#                                    empty on the first deploy, read
#                                    `interfaceKey` from its `/health`, set it,
#                                    and re-run
#   MODERATION_ANDROID_HOST          Default moderation-android.onym.app
#   MODERATION_PLAY_PACKAGE_NAME     app.onym.android — the package a decoded
#                                    integrity token must name
#   MODERATION_PLAY_CERT_SHA256_DIGESTS  Play App Signing cert SHA-256 digest(s),
#                                    base64url-nopad (Google's token spelling, NOT
#                                    the console's colon-hex), comma separated
#   MODERATION_ANDROID_INTERFACE_KEY_EPOCHS  Same shape as
#                                    MODERATION_INTERFACE_KEY_EPOCHS, for the
#                                    Android interface
#   AUTHORITY_INTERFACE_KEYS_BY_COMPONENT  onym:component:onym-android=<onym:key:hex>.
#                                    Like AUTHORITY_INTERFACE_KEY it cannot exist
#                                    until the Android interface has booted once:
#                                    leave empty on the first deploy, read
#                                    `interfaceKey` from its /health, set it, re-run
#   DROPLET_ID          set this after the first run (printed in the job
#                       summary) so subsequent runs reuse the same box

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # `recursive` covers both submodules — relayer and moderation —
      # so the two new build contexts are present without further work.
      - name: Checkout (with relayer + moderation submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_KEY }}

      - name: Install dig
        run: sudo apt-get update && sudo apt-get install -y dnsutils rsync

      # Only used when DOCR_NAME is set. The runner is amd64 and the
      # droplet is amd64, so this builds natively — no QEMU needed.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub

      - name: Write config files
        env:
          DO_API_KEY: ${{ secrets.DO_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          RELAYER_SECRET_KEY: ${{ secrets.RELAYER_SECRET_KEY }}
          RELAYER_AUTH_TOKENS: ${{ secrets.RELAYER_AUTH_TOKENS }}
          MODERATION_DEVICECHECK_KEY_PEM: ${{ secrets.MODERATION_DEVICECHECK_KEY_PEM }}
          MODERATION_DEVICECHECK_KEY_ID: ${{ secrets.MODERATION_DEVICECHECK_KEY_ID }}
          MODERATION_DEVICECHECK_TEAM_ID: ${{ secrets.MODERATION_DEVICECHECK_TEAM_ID }}
          MODERATION_INTERFACE_SIGNING_SEED: ${{ secrets.MODERATION_INTERFACE_SIGNING_SEED }}
          MODERATION_AUDIT_TOKEN: ${{ secrets.MODERATION_AUDIT_TOKEN }}
          MODERATION_PLAY_SA_KEY_JSON: ${{ secrets.MODERATION_PLAY_SA_KEY_JSON }}
          MODERATION_ANDROID_INTERFACE_SIGNING_SEED: ${{ secrets.MODERATION_ANDROID_INTERFACE_SIGNING_SEED }}
          MODERATION_ANDROID_AUTHORITY_TOKEN: ${{ secrets.MODERATION_ANDROID_AUTHORITY_TOKEN }}
          MODERATION_ANDROID_AUDIT_TOKEN: ${{ secrets.MODERATION_ANDROID_AUDIT_TOKEN }}
          # One secret, written into both files: the token the authority
          # presents to the interface is the token the interface expects.
          MODERATION_AUTHORITY_TOKEN: ${{ secrets.MODERATION_AUTHORITY_TOKEN }}
          AUTHORITY_SIGNING_SEED: ${{ secrets.AUTHORITY_SIGNING_SEED }}
          AUTHORITY_MODERATOR_TOKEN: ${{ secrets.AUTHORITY_MODERATOR_TOKEN }}
          AUTHORITY_ADMIN_TOKEN: ${{ secrets.AUTHORITY_ADMIN_TOKEN }}
        run: |
          cat > .env <<EOF
          DO_API_KEY=$DO_API_KEY
          CF_API_TOKEN=$CF_API_TOKEN
          DOMAIN=${{ vars.DOMAIN || 'onym.app' }}
          NOSTR_HOST=${{ vars.NOSTR_HOST || 'nostr.onym.app' }}
          BLOSSOM_HOST=${{ vars.BLOSSOM_HOST || 'blossom.onym.app' }}
          RELAYER_HOST=${{ vars.RELAYER_HOST || 'relayer.onym.app' }}
          MODERATION_HOST=${{ vars.MODERATION_HOST || 'moderation.onym.app' }}
          MODERATION_ANDROID_HOST=${{ vars.MODERATION_ANDROID_HOST || 'moderation-android.onym.app' }}
          AUTHORITY_HOST=${{ vars.AUTHORITY_HOST || 'authority.onym.app' }}
          MODERATION_DEVICECHECK_ENV=${{ vars.MODERATION_DEVICECHECK_ENV || 'production' }}
          MODERATION_ENFORCE_SIGNATURES=${{ vars.MODERATION_ENFORCE_SIGNATURES || 'true' }}
          MODERATION_INTERFACE_KEY_EPOCHS=${{ vars.MODERATION_INTERFACE_KEY_EPOCHS }}
          MODERATION_ANDROID_INTERFACE_KEY_EPOCHS=${{ vars.MODERATION_ANDROID_INTERFACE_KEY_EPOCHS }}
          MODERATION_PLAY_PACKAGE_NAME=${{ vars.MODERATION_PLAY_PACKAGE_NAME || 'app.onym.android' }}
          MODERATION_PLAY_CERT_SHA256_DIGESTS=${{ vars.MODERATION_PLAY_CERT_SHA256_DIGESTS }}
          AUTHORITY_INTERFACE_KEY=${{ vars.AUTHORITY_INTERFACE_KEY }}
          AUTHORITY_INTERFACE_KEYS_BY_COMPONENT=${{ vars.AUTHORITY_INTERFACE_KEYS_BY_COMPONENT }}
          AUTHORITY_TRIAGE_MODE=off
          AUTHORITY_QA_ALLOW_EARLY_BAN=true
          CADDY_EMAIL=${{ vars.CADDY_EMAIL || 'rinat@qda.one' }}
          DO_REGION=${{ vars.DO_REGION || 'ams3' }}
          DO_DROPLET_SIZE=${{ vars.DO_DROPLET_SIZE || 's-1vcpu-2gb' }}
          DOCR_NAME=${{ vars.DOCR_NAME }}
          SSH_KEY_PATH=$HOME/.ssh/deploy_key
          DROPLET_ID=${{ vars.DROPLET_ID }}
          DROPLET_IP=
          EOF
          cat > relayer.env <<EOF
          RELAYER_SECRET_KEY=$RELAYER_SECRET_KEY
          RELAYER_AUTH_TOKENS=$RELAYER_AUTH_TOKENS
          EOF

          # The .p8 goes in on one line: apple/src/config.rs reads
          # MODERATION_DEVICECHECK_KEY_PEM as an alternative to a key
          # path and un-escapes \n. Folding any real newlines here means
          # a secret pasted straight out of the file still produces a
          # parseable env file rather than five broken lines.
          DEVICECHECK_KEY_PEM_ONE_LINE="${MODERATION_DEVICECHECK_KEY_PEM//$'\n'/\\n}"
          cat > moderation.env <<EOF
          MODERATION_DEVICECHECK_KEY_PEM=$DEVICECHECK_KEY_PEM_ONE_LINE
          MODERATION_DEVICECHECK_KEY_ID=$MODERATION_DEVICECHECK_KEY_ID
          MODERATION_DEVICECHECK_TEAM_ID=$MODERATION_DEVICECHECK_TEAM_ID
          MODERATION_INTERFACE_SIGNING_SEED=$MODERATION_INTERFACE_SIGNING_SEED
          MODERATION_AUTHORITY_TOKEN=$MODERATION_AUTHORITY_TOKEN
          MODERATION_AUDIT_TOKEN=$MODERATION_AUDIT_TOKEN
          EOF

          # An unset Android authority token would deploy green with a
          # dead verdict path: the backend's /v1/verdicts refuses
          # everything, and the routes line below would carry an empty
          # bearer. Fail here instead.
          if [ -z "$MODERATION_ANDROID_AUTHORITY_TOKEN" ]; then
            echo "::error::MODERATION_ANDROID_AUTHORITY_TOKEN secret is not set — Android verdict delivery would be dead. Set it (openssl rand -hex 32) and re-run."
            exit 1
          fi
          # The SA key line is written only when the secret is set: a
          # PRESENT-but-empty MODERATION_PLAY_SA_KEY_JSON is parsed
          # (and fails) by the service, while an ABSENT one is the
          # supported degraded mode — every gate check answers
          # checkRequired until Google grants device-recall access.
          cat > moderation-android.env <<EOF
          MODERATION_INTERFACE_SIGNING_SEED=$MODERATION_ANDROID_INTERFACE_SIGNING_SEED
          MODERATION_AUTHORITY_TOKEN=$MODERATION_ANDROID_AUTHORITY_TOKEN
          MODERATION_AUDIT_TOKEN=$MODERATION_ANDROID_AUDIT_TOKEN
          EOF
          # The key file is often pasted pretty-printed, and env_file
          # is line-oriented — a multi-line value broke compose with
          # `unexpected character '"' in variable name`. Fold real
          # newlines away: JSON whitespace outside strings is
          # insignificant, and the private_key's \n are ESCAPED inside
          # a JSON string, so the folded value is the same document.
          # (Same trick as the DeviceCheck PEM fold above, inverted:
          # the PEM needs its newlines escaped, JSON just drops them.)
          SA_KEY_ONE_LINE="${MODERATION_PLAY_SA_KEY_JSON//$'\n'/}"
          SA_KEY_ONE_LINE="${SA_KEY_ONE_LINE//$'\r'/}"
          if [ -n "$SA_KEY_ONE_LINE" ]; then
            printf 'MODERATION_PLAY_SA_KEY_JSON=%s\n' "$SA_KEY_ONE_LINE" >> moderation-android.env
          fi

          # AUTHORITY_INTERFACE_TOKEN is deliberately the same secret as
          # the interface's MODERATION_AUTHORITY_TOKEN above — it is one
          # shared token seen from two sides, and two independently
          # rotated values would just be a delivery outage waiting to
          # happen.
          # The Android delivery route carries a bearer token, so the
          # whole ROUTES line is a secret and lives here rather than in
          # the droplet's compose .env. Verdicts for mandates naming
          # onym:component:onym-android are delivered to the Android
          # backend; every other interface keeps the default route.
          cat > authority.env <<EOF
          AUTHORITY_SIGNING_SEED=$AUTHORITY_SIGNING_SEED
          AUTHORITY_INTERFACE_TOKEN=$MODERATION_AUTHORITY_TOKEN
          AUTHORITY_INTERFACE_ROUTES=onym:component:onym-android=https://${{ vars.MODERATION_ANDROID_HOST || 'moderation-android.onym.app' }}|$MODERATION_ANDROID_AUTHORITY_TOKEN
          AUTHORITY_MODERATOR_TOKEN=$AUTHORITY_MODERATOR_TOKEN
          AUTHORITY_ADMIN_TOKEN=$AUTHORITY_ADMIN_TOKEN
          EOF

      - name: Deploy
        run: ./deploy/digitalocean/deploy.sh

      - name: Summary (set DROPLET_ID variable from this to reuse the box)
        if: always()
        run: |
          echo "### Deploy" >> "$GITHUB_STEP_SUMMARY"
          grep '^DROPLET_' .env 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
