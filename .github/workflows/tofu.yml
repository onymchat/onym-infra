name: tofu

# OpenTofu (`tofu`, not `terraform`) CI for terraform/:
#
#   pull_request  fmt-check + validate always (fork PRs included); a
#                 real `tofu plan`, posted as a PR comment, only for
#                 same-repo PRs (explicit condition on the plan job —
#                 the comment exposes infra inventory). NOTHING is
#                 applied.
#   push to main  ungated plan (saved as an artifact, shown in the
#                 step summary) → apply of that EXACT saved plan,
#                 gated behind the `production` environment — the
#                 human approves a plan they can actually read.
#   schedule      weekly drift plan; a non-empty diff opens (or
#                 updates) a "tofu drift" issue.
#
# Secrets used (org/repo secrets -> the env names the providers read):
#   DO_API_KEY               -> DIGITALOCEAN_TOKEN   (same secret deploy.yml uses)
#   CF_API_TOKEN             -> CLOUDFLARE_API_TOKEN (same secret deploy.yml uses)
#   TF_GITHUB_TOKEN          -> GITHUB_TOKEN  PAT with admin on
#                               onym-discovery/onym-relayer/onym-infra;
#                               the workflow's own GITHUB_TOKEN cannot
#                               manage environments on OTHER repos
#   SPACES_ACCESS_KEY_ID     -> AWS_ACCESS_KEY_ID     (state backend, see terraform/backend.tf)
#   SPACES_SECRET_ACCESS_KEY -> AWS_SECRET_ACCESS_KEY
#
# Secret VALUES are never resources here — see terraform/github.tf for
# the secrets-never-in-state rule.

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/tofu.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/tofu.yml"
  schedule:
    # Weekly drift check, Monday 06:20 UTC.
    - cron: "20 6 * * 1"

permissions:
  contents: read

defaults:
  run:
    working-directory: terraform

env:
  TOFU_VERSION: "1.12.5"

jobs:
  fmt-and-validate:
    name: fmt-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt -check
        run: tofu fmt -check -diff -recursive

      # Backend-less init: validation needs providers, not state, so
      # this runs with zero credentials — including on fork PRs.
      - name: tofu init -backend=false
        run: tofu init -backend=false

      - name: tofu validate
        run: tofu validate

  plan:
    name: plan (PR)
    # Same-repo PRs only, by explicit condition — not by relying on
    # fork PRs happening to see empty secrets. Two reasons: the plan
    # comment embeds infrastructure inventory (droplet public IP,
    # Cloudflare zone/record ids) that fork authors have no need to
    # see, and a plan run refreshes state, which must never race an
    # apply on behalf of an untrusted head ref.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: fmt-and-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # State has NO backend-level lock (see terraform/backend.tf): this
    # group is the only thing serializing state readers/writers, so the
    # plan job joins it too — a PR plan must not run concurrently with
    # an apply.
    concurrency:
      group: tofu-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      # Fork PRs never reach this job (see the job's `if`), but on a
      # fresh clone of this repo the secrets may simply not be
      # configured yet; detect that instead of failing init or plan
      # with an opaque credentials error. All FOUR are checked — a
      # missing CF_API_TOKEN or TF_GITHUB_TOKEN would otherwise die
      # mid-plan with exactly the provider error this step exists to
      # avoid.
      - name: Check secret availability
        id: creds
        env:
          DO_API_KEY: ${{ secrets.DO_API_KEY }}
          SPACES_KEY: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_PAT: ${{ secrets.TF_GITHUB_TOKEN }}
        run: |
          missing=""
          [ -z "$DO_API_KEY" ] && missing="$missing DO_API_KEY"
          [ -z "$SPACES_KEY" ] && missing="$missing SPACES_ACCESS_KEY_ID (+ its SECRET pair)"
          [ -z "$CF_TOKEN" ]   && missing="$missing CF_API_TOKEN"
          [ -z "$GH_PAT" ]     && missing="$missing TF_GITHUB_TOKEN"
          if [ -z "$missing" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Not configured on this repo yet:$missing" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Skipping the plan (fmt + validate still ran). See terraform/README.md step 7." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: tofu plan
        id: plan
        if: steps.creds.outputs.available == 'true'
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DO_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
        run: |
          tofu init -input=false
          tofu plan -input=false -no-color -out=tfplan
          tofu show -no-color tfplan > plan.txt

      - name: Comment plan on PR
        if: steps.creds.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n... (truncated; full plan in the workflow log)';
            }
            const marker = '<!-- tofu-plan-comment -->';
            const body = `${marker}\n### \`tofu plan\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`;
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const prev = comments.find(c => c.body && c.body.startsWith(marker));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: prev.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Note validate-only run
        if: steps.creds.outputs.available != 'true'
        run: |
          echo "### tofu: validate-only" >> "$GITHUB_STEP_SUMMARY"
          echo "Secrets are not configured on this repo yet," >> "$GITHUB_STEP_SUMMARY"
          echo "so no plan was produced. fmt + validate passed in the previous job." >> "$GITHUB_STEP_SUMMARY"

  # The apply flow is TWO jobs on purpose: the environment gate on a
  # single plan+apply job would fire BEFORE the plan exists, so the
  # reviewer would approve with nothing to review — a "yes, deploy
  # something" button. Instead: `plan-main` (ungated) produces tfplan
  # and shows it in the step summary; `apply` (gated) applies THAT
  # exact saved file — no re-plan, so what was reviewed is what runs.
  plan-main:
    name: plan (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: fmt-and-validate
    runs-on: ubuntu-latest
    concurrency:
      group: tofu-state
      cancel-in-progress: false
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        run: tofu init -input=false

      - name: tofu plan
        run: |
          tofu plan -input=false -no-color -out=tfplan
          echo '### `tofu plan` awaiting approval' >> "$GITHUB_STEP_SUMMARY"
          echo 'Review this plan, then approve the `production` gate on the apply job — the SAVED plan below is exactly what will be applied.' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tofu show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 7
          if-no-files-found: error

  apply:
    name: apply (main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan-main
    runs-on: ubuntu-latest
    # A human approves every apply: this is the `production` environment
    # on THIS repo, protected with required reviewers. Like the one
    # onym-discovery's workflow warns about, it is auto-created
    # UNPROTECTED on first run — add required reviewers in repo
    # Settings -> Environments BEFORE the first push to main.
    environment: production
    concurrency:
      group: tofu-state
      cancel-in-progress: false
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        run: tofu init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform

      # Applies the EXACT saved plan the reviewer saw — no re-plan.
      # Staleness is self-protecting: a saved plan records the state
      # serial it was computed against, and if state moved while the
      # approval sat in the queue (another apply, a local run), this
      # apply ERRORS on the serial mismatch instead of applying a stale
      # diff. On that error: re-run the workflow to get a fresh plan.
      - name: tofu apply (saved plan)
        run: tofu apply -input=false -no-color tfplan

  drift:
    name: drift (weekly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: tofu-state
      cancel-in-progress: false
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.TF_GITHUB_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu plan (drift check)
        id: plan
        run: |
          tofu init -input=false
          set +e
          tofu plan -input=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          # 0 = clean, 2 = drift, anything else = error.
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit "$code"; fi
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          tofu show -no-color tfplan > plan.txt

      - name: Open or update drift issue
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n... (truncated; full plan in the workflow log)';
            }
            const title = 'tofu drift: live infrastructure differs from terraform/';
            const body = `The weekly drift plan found differences between the OpenTofu configuration and live infrastructure.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>\n\nEither the live change should be encoded in terraform/, or it was unintended and \`tofu apply\` should revert it.`;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const prev = issues.find(i => i.title === title);
            if (prev) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prev.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['infrastructure'],
              });
            }
