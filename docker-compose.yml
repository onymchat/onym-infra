name: onym-infra

# Consolidated onym.app backend: Nostr relay (strfry), Blossom media
# server, the Soroban contract relayer, and the two moderation services
# — all behind Caddy, which terminates TLS and provisions/renews Let's
# Encrypt certificates automatically (no certbot sidecar, no cron, no
# manual renewal).
#
# Hostnames are env-driven (see .env) so the same stack can serve a
# staging domain without edits. Caddy reaches each service by its
# compose name over the private `internal` network; only Caddy
# publishes ports to the host.
#
# The two moderation services are folded in from onym-moderation, whose
# repository ships each of them as a standalone stack with its own
# Caddy. Those Caddies, their published ports and their private
# networks are all dropped here in favour of this one; the services
# themselves are unchanged.
#
# They share a box for cost, and for no other reason. In the contract
# they are *different operators* — the authority decides and signs, the
# interface vendor executes, and neither can do the other's half. That
# is why they duplicate `canonical.rs` instead of sharing a crate: they
# must agree on bytes, not on code. Co-location here is an accident of
# this deployment and nothing may be built on it, which is why the
# authority reaches the interface over its public hostname and not over
# this network — see `AUTHORITY_INTERFACE_URL` below.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    environment:
      # Consumed by the Caddyfile via {$VAR} substitution at load time.
      - CADDY_EMAIL=${CADDY_EMAIL:-}
      - NOSTR_HOST=${NOSTR_HOST:-nostr.onym.app}
      - BLOSSOM_HOST=${BLOSSOM_HOST:-blossom.onym.app}
      - RELAYER_HOST=${RELAYER_HOST:-relayer.onym.app}
      - MODERATION_HOST=${MODERATION_HOST:-moderation.onym.app}
      - AUTHORITY_HOST=${AUTHORITY_HOST:-authority.onym.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The authority's published policy documents, served under
      # /policy/. They are terms a user reads before consenting rather
      # than application data, and the authority serves only
      # /manifest.json and /v1/*, so Caddy is what routes them.
      - ./moderation/authority/published:/srv/policy:ro
      # Persists issued certificates + ACME account across restarts.
      # Losing this volume just means Caddy re-issues on next boot.
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on: [nostr-relay, blossom, relayer, moderation, authority]

  nostr-relay:
    image: dockurr/strfry:latest
    restart: unless-stopped
    volumes:
      - ./strfry/strfry.conf:/etc/strfry.conf:ro
      - strfry-data:/app/strfry-db
    networks: [internal]

  blossom:
    image: ghcr.io/hzrd149/blossom-server:latest
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
    volumes:
      - blossom-data:/app/data
    networks: [internal]

  relayer:
    build:
      context: ./relayer
      dockerfile: Dockerfile
    restart: unless-stopped
    # Secrets (RELAYER_SECRET_KEY, RELAYER_AUTH_TOKENS, RPC URLs) live
    # in relayer.env — never committed. See relayer.env.example.
    env_file: ./relayer.env
    environment:
      # Bind on all interfaces inside the container so Caddy can reach
      # it; the port is NOT published to the host.
      - RELAYER_BIND=0.0.0.0:8080
    networks: [internal]

  # The enforcement backend — "the interface" in onym-moderation's
  # vocabulary. It holds the Apple DeviceCheck key, and the only write
  # path to any device's bits runs through it, which is why it stays on
  # the private network with no published port of its own.
  moderation:
    build:
      context: ./moderation/apple
      dockerfile: Dockerfile
    restart: unless-stopped
    # Secrets (the DeviceCheck .p8 and key/team ids, the interface
    # signing seed, the token the authority presents) live in
    # moderation.env — never committed. See moderation.env.example.
    env_file: ./moderation.env
    environment:
      # Bind on all interfaces inside the container so Caddy can reach
      # it; the port is NOT published to the host.
      - MODERATION_BIND=0.0.0.0:8080
      - MODERATION_STORE_PATH=/data/moderation.sqlite
      - MODERATION_DEVICECHECK_ENV=${MODERATION_DEVICECHECK_ENV:-production}
      - MODERATION_INTERFACE_COMPONENT_ID=${MODERATION_INTERFACE_COMPONENT_ID:-onym:component:onym-ios}
      # Which countersigning key each authority expects, as
      # <componentId>=<epoch> pairs. Empty means every authority is on
      # epoch 0 — the root seed used directly — which is the state
      # before anyone was rotated and needs no entry. Not a secret: the
      # epochs say which key is in force, not what it is.
      - MODERATION_INTERFACE_KEY_EPOCHS=${MODERATION_INTERFACE_KEY_EPOCHS:-}
      # Whether a verdict must carry a signature that verifies against
      # the authority's published key. There is no fail-open default:
      # deploy.sh materializes the matching manifest before startup.
      - MODERATION_ENFORCE_SIGNATURES=${MODERATION_ENFORCE_SIGNATURES:?set MODERATION_ENFORCE_SIGNATURES in .env (normally true)}
      # Left false on purpose: without it, an unset MODERATION_AUTHORITY_TOKEN
      # fails closed rather than leaving the verdict endpoint open.
      - MODERATION_ALLOW_UNAUTHENTICATED_AUTHORITY=${MODERATION_ALLOW_UNAUTHENTICATED_AUTHORITY:-false}
      - MODERATION_SESSION_MAX_SKEW_SECS=${MODERATION_SESSION_MAX_SKEW_SECS:-300}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      # The verdict record and the write log. Losing this volume loses
      # the meaning behind every bit Apple is holding — the bits alone
      # cannot be reconstructed into verdicts — so back it up.
      - moderation-data:/data
    networks: [internal]

  # The moderation authority. It opens cases, decides them, and signs
  # verdicts; it has no Apple credentials and no way to mark a device
  # itself. That separation is the point, so resist giving this service
  # a write path to a device in some future edit.
  authority:
    build:
      context: ./moderation/authority
      dockerfile: Dockerfile
    restart: unless-stopped
    # Secrets (the verdict signing seed, the interface token, the
    # moderator and admin tokens) live in authority.env — never
    # committed. See authority.env.example.
    env_file: ./authority.env
    environment:
      - AUTHORITY_BIND=0.0.0.0:8080
      - AUTHORITY_STORE_PATH=/data/authority.sqlite
      - AUTHORITY_MANIFEST_PATH=/manifest/manifest.json
      # Verdicts are delivered to the interface over its **public**
      # hostname, deliberately, even though it happens to be running in
      # the container next door.
      #
      # `http://moderation:8080` would be one hop shorter and would not
      # wait on ACME at first boot. It would also hardcode the
      # assumption that these two are the same operator on the same
      # machine, which the contract says they are not: the interface
      # vendor is a separate party, and this box is a cost decision.
      # The day the interface moves — to its own droplet, or to a vendor
      # who is not us — a private service name is a broken deployment
      # and a comment nobody can explain, while a public hostname simply
      # points somewhere else.
      #
      # It also means the reference deployment exercises the same path
      # every other deployment must use: TLS, the shared bearer token,
      # and a verdict signature the interface verifies independently.
      # A private shortcut here would leave that path untested by the
      # one deployment best placed to test it.
      #
      # Derived from MODERATION_HOST rather than configured separately,
      # so the interface's address and the authority's idea of it cannot
      # drift — and so it keeps working when that host is elsewhere.
      - AUTHORITY_INTERFACE_URL=https://${MODERATION_HOST:-moderation.onym.app}
      # The interface's *public* countersigning key (onym:key:<hex>),
      # used to check that a registered mandate really was
      # countersigned. It is derived from the interface's signing seed
      # and cannot be known until the interface has booted once and
      # logged it, so this is empty on a first deploy and set after.
      - AUTHORITY_INTERFACE_KEY=${AUTHORITY_INTERFACE_KEY:-}
      - AUTHORITY_DEADLINE_SWEEP_SECS=${AUTHORITY_DEADLINE_SWEEP_SECS:-300}
      # Automated triage is off here. Turning it on means adding a
      # model container to this stack — the authority deliberately
      # defaults to a sibling on the private network, because case
      # evidence was disclosed for adjudication and shipping it to
      # someone else's API is a disclosure of its own.
      - AUTHORITY_TRIAGE_MODE=${AUTHORITY_TRIAGE_MODE:-off}
      - AUTHORITY_TRIAGE_URL=${AUTHORITY_TRIAGE_URL:-http://moderation-model:8000/v1/chat/completions}
      - AUTHORITY_TRIAGE_PROFILE=${AUTHORITY_TRIAGE_PROFILE:-}
      - AUTHORITY_TRIAGE_SERVED_MODEL=${AUTHORITY_TRIAGE_SERVED_MODEL:-}
      - AUTHORITY_TRIAGE_TIMEOUT_SECS=${AUTHORITY_TRIAGE_TIMEOUT_SECS:-120}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      # Cases, reports, reporter track records, and issued verdicts.
      # Losing this loses the record behind every mark the interface is
      # holding — and an accused person's evidence that a case existed.
      - authority-data:/data
      # deploy.sh materializes the reference manifest with this
      # deployment's operator key and public hostname before startup.
      # It is served byte-for-byte because mandates pin these bytes.
      - ./runtime/authority-manifest:/manifest:ro
    networks: [internal]

volumes:
  caddy-data:
  caddy-config:
  strfry-data:
  blossom-data:
  moderation-data:
  authority-data:

networks:
  internal:
    driver: bridge
