name: onym-infra

# Consolidated onym.app backend: Nostr relay (strfry), Blossom media
# server, the Soroban contract relayer, and the three moderation services
# — all behind Caddy, which terminates TLS and provisions/renews Let's
# Encrypt certificates automatically (no certbot sidecar, no cron, no
# manual renewal).
#
# Hostnames are env-driven (see .env) so the same stack can serve a
# staging domain without edits. Caddy reaches each service by its
# compose name over the private `internal` network; only Caddy
# publishes ports to the host.
#
# The moderation services are folded in from onym-moderation, whose
# repository ships each of them as a standalone stack with its own
# Caddy. Those Caddies, their published ports and their private
# networks are all dropped here in favour of this one; the services
# themselves are unchanged.
#
# They share a box for cost, and for no other reason. In the contract
# they are *different operators* — the authority decides and signs, the
# interface vendor executes, and neither can do the other's half. That
# is why they duplicate `canonical.rs` instead of sharing a crate: they
# must agree on bytes, not on code. Co-location here is an accident of
# this deployment and nothing may be built on it, which is why the
# authority reaches the interface over its public hostname and not over
# this network — see `AUTHORITY_INTERFACE_URL` below.

# Memory limits. Every service is capped so that no single container can
# exhaust the box and let the kernel's OOM killer pick the victim. That
# matters most for the two moderation services: the authority/interface
# split is a deliberate separation of powers, and an unbounded relay
# taking down the authority would undo it at the kernel level, far below
# where the design reasons about it.
#
# strfry gets the largest share because it is the only service with
# unbounded fan-out — a client REQ with no `limit` buffers the whole
# result set, and the strfry release we run (1.1.1) has no outbound
# buffer cap; `maxPendingOutboundBytes` exists only on upstream master.
# Until the client paginates or uses negentropy for backfill, this limit
# IS the cap. A relay that gets killed and restarts is a far better
# outcome than one that takes the authority with it.
#
# Budgeted for s-2vcpu-4gb: 3264M capped, leaving ~832M for the host,
# dockerd and page cache. Revisit these together if the droplet resizes.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (QUIC)
    environment:
      # Consumed by the Caddyfile via {$VAR} substitution at load time.
      - CADDY_EMAIL=${CADDY_EMAIL:-}
      - NOSTR_HOST=${NOSTR_HOST:-nostr.onym.app}
      - BLOSSOM_HOST=${BLOSSOM_HOST:-blossom.onym.app}
      - RELAYER_HOST=${RELAYER_HOST:-relayer.onym.app}
      - MODERATION_HOST=${MODERATION_HOST:-moderation.onym.app}
      - MODERATION_ANDROID_HOST=${MODERATION_ANDROID_HOST:-moderation-android.onym.app}
      - AUTHORITY_HOST=${AUTHORITY_HOST:-authority.onym.app}
      - DISCOVERY_HOST=${DISCOVERY_HOST:-discovery.onym.app}
      - BACKUP_HOST=${BACKUP_HOST:-backup.onym.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The authority's published policy documents, served under
      # /policy/. They are terms a user reads before consenting rather
      # than application data, and the authority serves only
      # /manifest.json and /v1/*, so Caddy is what routes them.
      - ./moderation/authority/published:/srv/policy:ro
      # The materialized manifest directory, for serving the detached
      # signature. deploy.sh writes manifest.json.sig next to the
      # manifest it signs; the authority itself serves only
      # /manifest.json and /v1/*, so Caddy is what routes the `.sig`
      # (clients verify the manifest's exact bytes against the
      # directory-pinned operator key before trusting the terms).
      - ./runtime/authority-manifest:/srv/authority-manifest:ro
      # The Onym Discovery provider's static tree. Deliberately OUTSIDE
      # /opt/onym-infra: the artifacts are published by the
      # onym-discovery repo's Deploy workflow (signed + verified there,
      # rsynced to /var/www/discovery), and this repo's own rsync
      # --delete must never sweep them away. deploy.sh creates the
      # directory, so the vhost serves clean 404s (a valid degraded
      # state) until the first discovery publish lands.
      - /var/www/discovery:/srv/discovery:ro
      # Persists issued certificates + ACME account across restarts.
      # Losing this volume just means Caddy re-issues on next boot.
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on: [nostr-relay, blossom, relayer, moderation, moderation-android, authority, backup]

  nostr-relay:
    # Pinned deliberately. This was `:latest`, which had drifted — the
    # running container reported 1.1.0 while `latest` had moved on to
    # 1.1.1, so the next pull would have changed relay versions during
    # whatever deploy happened to trigger it. Upgrade on purpose.
    image: dockurr/strfry:1.1.1
    restart: unless-stopped
    mem_limit: 1g
    volumes:
      - ./strfry/strfry.conf:/etc/strfry.conf:ro
      - strfry-data:/app/strfry-db
    networks: [internal]

  blossom:
    image: ghcr.io/hzrd149/blossom-server:latest
    restart: unless-stopped
    environment:
      - DATA_DIR=/app/data
      - PORT=3000
    mem_limit: 384m
    volumes:
      - blossom-data:/app/data
    networks: [internal]

  relayer:
    # Pulled from the container registry when DOCR_NAME is set — the tag
    # is the relayer submodule's commit. Unset, the fallback tag is
    # whatever `docker compose build` last produced on this machine.
    # See README: Container images.
    image: ${RELAYER_IMAGE:-onym-infra-relayer:local}
    build:
      context: ./relayer
      dockerfile: Dockerfile
    restart: unless-stopped
    # Secrets (RELAYER_SECRET_KEY, RELAYER_AUTH_TOKENS, RPC URLs) live
    # in relayer.env — never committed. See relayer.env.example.
    env_file: ./relayer.env
    environment:
      # Bind on all interfaces inside the container so Caddy can reach
      # it; the port is NOT published to the host.
      - RELAYER_BIND=0.0.0.0:8080
      # Not a secret — a fixed path inside the image, where the relayer
      # Dockerfile bakes the signed operator manifest (manifest-signed/).
      # Committed here so CI deploys it; `environment:` wins over
      # env_file, keeping the droplet's relayer.env free of this key.
      - RELAYER_OPERATOR_MANIFEST=/srv/operator-manifest/manifest.json
    mem_limit: 384m
    networks: [internal]

  # The enforcement backend — "the interface" in onym-moderation's
  # vocabulary. It holds the Apple DeviceCheck key, and the only write
  # path to any device's bits runs through it, which is why it stays on
  # the private network with no published port of its own.
  moderation:
    image: ${MODERATION_IMAGE:-onym-infra-moderation:local}
    build:
      context: ./moderation/apple
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 320m
    # Secrets (the DeviceCheck .p8 and key/team ids, the interface
    # signing seed, the token the authority presents) live in
    # moderation.env — never committed. See moderation.env.example.
    env_file: ./moderation.env
    environment:
      # Bind on all interfaces inside the container so Caddy can reach
      # it; the port is NOT published to the host.
      - MODERATION_BIND=0.0.0.0:8080
      - MODERATION_STORE_PATH=/data/moderation.sqlite
      - MODERATION_DEVICECHECK_ENV=${MODERATION_DEVICECHECK_ENV:-production}
      - MODERATION_INTERFACE_COMPONENT_ID=${MODERATION_INTERFACE_COMPONENT_ID:-onym:component:onym-ios}
      # Which countersigning key each authority expects, as
      # <componentId>=<epoch> pairs. Empty means every authority is on
      # epoch 0 — the root seed used directly — which is the state
      # before anyone was rotated and needs no entry. Not a secret: the
      # epochs say which key is in force, not what it is.
      - MODERATION_INTERFACE_KEY_EPOCHS=${MODERATION_INTERFACE_KEY_EPOCHS:-}
      # Whether a verdict must carry a signature that verifies against
      # the authority's published key. There is no fail-open default:
      # deploy.sh materializes the matching manifest before startup.
      - MODERATION_ENFORCE_SIGNATURES=${MODERATION_ENFORCE_SIGNATURES:?set MODERATION_ENFORCE_SIGNATURES in .env (normally true)}
      # Left false on purpose: without it, an unset MODERATION_AUTHORITY_TOKEN
      # fails closed rather than leaving the verdict endpoint open.
      - MODERATION_ALLOW_UNAUTHENTICATED_AUTHORITY=${MODERATION_ALLOW_UNAUTHENTICATED_AUTHORITY:-false}
      - MODERATION_SESSION_MAX_SKEW_SECS=${MODERATION_SESSION_MAX_SKEW_SECS:-300}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      # The verdict record and the write log. Losing this volume loses
      # the meaning behind every bit Apple is holding — the bits alone
      # cannot be reconstructed into verdicts — so back it up.
      - moderation-data:/data
    networks: [internal]

  # The Android enforcement backend — the interface for
  # onym:component:onym-android, speaking Google Play Integrity device
  # recall where its sibling above speaks Apple DeviceCheck. A separate
  # service on purpose: the two agree on bytes, not on code (each is
  # its own crate in the submodule), hold different platform
  # credentials, and countersign under different component ids. It
  # holds the linked Cloud project's service-account key — the only
  # write path to any device's recall values — so it too stays on the
  # private network with no published port.
  moderation-android:
    image: ${MODERATION_ANDROID_IMAGE:-onym-infra-moderation-android:local}
    build:
      context: ./moderation/android
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 320m
    # Secrets (the Google service-account JSON, the interface signing
    # seed, the token the authority presents) live in
    # moderation-android.env — never committed. See
    # moderation-android.env.example.
    env_file: ./moderation-android.env
    environment:
      - MODERATION_BIND=0.0.0.0:8080
      - MODERATION_STORE_PATH=/data/moderation.sqlite
      # The crate defaults to onym:component:onym-android; stated
      # explicitly so the two interfaces' component ids sit side by
      # side in one file.
      - MODERATION_INTERFACE_COMPONENT_ID=${MODERATION_ANDROID_INTERFACE_COMPONENT_ID:-onym:component:onym-android}
      # Which app + signing certificate a decoded integrity token must
      # name (classifier conditions 1–2). Not secrets: the package name
      # is public and the digest is of a public certificate. The
      # package default matches the workflow's so local and CI deploys
      # boot the same classifier.
      - MODERATION_PLAY_PACKAGE_NAME=${MODERATION_PLAY_PACKAGE_NAME:-app.onym.android}
      - MODERATION_PLAY_CERT_SHA256_DIGESTS=${MODERATION_PLAY_CERT_SHA256_DIGESTS:-}
      # INTERIM pre-device-recall-grant switch: "false" lets the gate
      # answer from prerequisites 1-4 when tokens carry no deviceRecall
      # object (no token does until Google's grant lands). Default
      # true = the strict profile; flip back the day the grant lands.
      - MODERATION_REQUIRE_RECALL=${MODERATION_REQUIRE_RECALL:-true}
      - MODERATION_INTERFACE_KEY_EPOCHS=${MODERATION_ANDROID_INTERFACE_KEY_EPOCHS:-}
      - MODERATION_ENFORCE_SIGNATURES=${MODERATION_ENFORCE_SIGNATURES:?set MODERATION_ENFORCE_SIGNATURES in .env (normally true)}
      - MODERATION_ALLOW_UNAUTHENTICATED_AUTHORITY=${MODERATION_ALLOW_UNAUTHENTICATED_AUTHORITY:-false}
      - MODERATION_SESSION_MAX_SKEW_SECS=${MODERATION_SESSION_MAX_SKEW_SECS:-300}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      # The verdict record and the write log. Losing this volume loses
      # the meaning behind every recall value Google is holding — the
      # values alone cannot be reconstructed into verdicts — so back
      # it up alongside moderation-data.
      - moderation-android-data:/data
    networks: [internal]

  # The moderation authority. It opens cases, decides them, and signs
  # verdicts; it has no Apple credentials and no way to mark a device
  # itself. That separation is the point, so resist giving this service
  # a write path to a device in some future edit.
  authority:
    image: ${AUTHORITY_IMAGE:-onym-infra-authority:local}
    build:
      context: ./moderation/authority
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 320m
    # Secrets (the verdict signing seed, the interface token, the
    # moderator and admin tokens) live in authority.env — never
    # committed. See authority.env.example.
    env_file: ./authority.env
    environment:
      - AUTHORITY_BIND=0.0.0.0:8080
      - AUTHORITY_STORE_PATH=/data/authority.sqlite
      - AUTHORITY_MANIFEST_PATH=/manifest/manifest.json
      # Verdicts are delivered to the interface over its **public**
      # hostname, deliberately, even though it happens to be running in
      # the container next door.
      #
      # `http://moderation:8080` would be one hop shorter and would not
      # wait on ACME at first boot. It would also hardcode the
      # assumption that these two are the same operator on the same
      # machine, which the contract says they are not: the interface
      # vendor is a separate party, and this box is a cost decision.
      # The day the interface moves — to its own droplet, or to a vendor
      # who is not us — a private service name is a broken deployment
      # and a comment nobody can explain, while a public hostname simply
      # points somewhere else.
      #
      # It also means the reference deployment exercises the same path
      # every other deployment must use: TLS, the shared bearer token,
      # and a verdict signature the interface verifies independently.
      # A private shortcut here would leave that path untested by the
      # one deployment best placed to test it.
      #
      # Derived from MODERATION_HOST rather than configured separately,
      # so the interface's address and the authority's idea of it cannot
      # drift — and so it keeps working when that host is elsewhere.
      - AUTHORITY_INTERFACE_URL=https://${MODERATION_HOST:-moderation.onym.app}
      # The interface's *public* countersigning key (onym:key:<hex>),
      # used to check that a registered mandate really was
      # countersigned. It is derived from the interface's signing seed
      # and cannot be known until the interface has booted once and
      # logged it, so this is empty on a first deploy and set after.
      - AUTHORITY_INTERFACE_KEY=${AUTHORITY_INTERFACE_KEY:-}
      # Per-interface countersigning keys, <componentId>=<onym:key:hex>
      # comma separated. With two interface backends the flat
      # AUTHORITY_INTERFACE_KEY union would let one backend's key
      # witness mandates naming the other; a listed component is
      # verified against exactly its own keys. Like
      # AUTHORITY_INTERFACE_KEY, the Android entry cannot exist until
      # that interface has booted once — empty on a first deploy, set
      # from its /health afterwards. (The delivery ROUTE for the
      # Android interface carries a bearer token and therefore lives
      # in authority.env, not here.)
      - AUTHORITY_INTERFACE_KEYS_BY_COMPONENT=${AUTHORITY_INTERFACE_KEYS_BY_COMPONENT:-}
      # Read by `finalize-manifest` at deploy time, not by the running
      # service: the public base URL that lands in the finalized
      # manifest's `endpoints` for discovery-seat review. Derived from
      # AUTHORITY_HOST rather than configured separately, so the
      # published endpoint cannot drift from where the manifest is
      # actually served.
      - AUTHORITY_PUBLIC_URL=https://${AUTHORITY_HOST:-authority.onym.app}
      # The human-readable name for the manifest's discovery catalog
      # row. Empty means the subcommand's default, "Onym Authority".
      - AUTHORITY_MANIFEST_NAME=${AUTHORITY_MANIFEST_NAME:-}
      - AUTHORITY_DEADLINE_SWEEP_SECS=${AUTHORITY_DEADLINE_SWEEP_SECS:-300}
      # Automated triage is off here. Turning it on means adding a
      # model container to this stack — the authority deliberately
      # defaults to a sibling on the private network, because case
      # evidence was disclosed for adjudication and shipping it to
      # someone else's API is a disclosure of its own.
      - AUTHORITY_TRIAGE_MODE=${AUTHORITY_TRIAGE_MODE:-off}
      # QA only: allow the human panel to exercise a ban before the
      # consented response window closes. Never enable on production.
      - AUTHORITY_QA_ALLOW_EARLY_BAN=${AUTHORITY_QA_ALLOW_EARLY_BAN:-false}
      - AUTHORITY_TRIAGE_URL=${AUTHORITY_TRIAGE_URL:-http://moderation-model:8000/v1/chat/completions}
      - AUTHORITY_TRIAGE_PROFILE=${AUTHORITY_TRIAGE_PROFILE:-}
      - AUTHORITY_TRIAGE_SERVED_MODEL=${AUTHORITY_TRIAGE_SERVED_MODEL:-}
      - AUTHORITY_TRIAGE_TIMEOUT_SECS=${AUTHORITY_TRIAGE_TIMEOUT_SECS:-120}
      - RUST_LOG=${RUST_LOG:-info}
    volumes:
      # Cases, reports, reporter track records, and issued verdicts.
      # Losing this loses the record behind every mark the interface is
      # holding — and an accused person's evidence that a case existed.
      - authority-data:/data
      # deploy.sh materializes the reference manifest with this
      # deployment's operator key and public hostname before startup.
      # It is served byte-for-byte because mandates pin these bytes.
      - ./runtime/authority-manifest:/manifest:ro
    networks: [internal]

  # The device-backup retention operator. It holds sealed snapshots and
  # cannot read them: every snapshot arrives encrypted under a key
  # derived from the holder's BIP39 recovery phrase, and no code path in
  # the service can open one. That is the absence of a capability rather
  # than a promise about conduct, which is why this service can sit
  # beside the others without widening what this box knows.
  #
  # Free mode: BACKUP_ENTITLEMENT_ISSUERS is deliberately unset, so the
  # operator never returns 402 and never consults an entitlement.
  # Nothing issues a SeatEntitlement yet, so a charging operator would
  # refuse every upload with a refusal no client could clear.
  backup:
    image: ${BACKUP_IMAGE:-onym-infra-backup:local}
    build:
      context: ./backup
      dockerfile: Dockerfile
    restart: unless-stopped
    # BACKUP_SIGNING_SEED lives in backup.env — never committed. See
    # backup.env.example, and read what it says about losing it.
    env_file: ./backup.env
    environment:
      # Bind on all interfaces inside the container so Caddy can reach
      # it; the port is NOT published to the host.
      - BACKUP_BIND=0.0.0.0:8080
      - BACKUP_COMPONENT_ID=${BACKUP_COMPONENT_ID:-onym:component:onym-backup}
      # The origin the manifest publishes and clients bind to. Derived
      # from BACKUP_HOST so what is advertised cannot drift from where
      # it is served.
      - BACKUP_PUBLIC_URL=https://${BACKUP_HOST:-backup.onym.app}
      - BACKUP_STORE_PATH=/data/backup.sqlite
      - BACKUP_BLOB_ROOT=/blobs
      # Sized far below the operator's own defaults (2 GiB x 3), and
      # for the block volume rather than for what a holder would want.
      # Raising these is a capacity decision about that volume, not a
      # product one — see README "Capacity".
      - BACKUP_MAX_SNAPSHOT_BYTES=${BACKUP_MAX_SNAPSHOT_BYTES:-268435456}
      - BACKUP_MAX_SNAPSHOTS=${BACKUP_MAX_SNAPSHOTS:-2}
      - RUST_LOG=${RUST_LOG:-info}
    # **Refuse to serve unless the block volume is really mounted.**
    #
    # The deploy-time `mountpoint` gate protects the deploy path and
    # nothing else. The dangerous path is a reboot: the fstab entry uses
    # `nofail` so the box still comes up if the volume does not, Docker
    # starts, `restart: unless-stopped` brings this container back, and
    # the bind mount resolves to the bare directory on the ROOT
    # filesystem. Snapshots would be acknowledged, written there, and
    # then shadowed the moment the volume mounted later — the operator
    # reporting `retained` for bytes nobody can reach, for the only copy
    # of anyone's backup.
    #
    # The sentinel lives inside the volume, so it is absent exactly when
    # the mount is. Failing here rather than in `docker.service` is
    # deliberate: `RequiresMountsFor` would make a backup volume problem
    # refuse to start the relay and the authority too, which inverts the
    # blast-radius argument this separation exists to make. A restart
    # loop on one container is visible, contained, and writes nothing.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /blobs/.onym-backup-volume ]; then
          echo "FATAL: /blobs is not the backup block volume (sentinel absent)." >&2
          echo "Refusing to write sealed snapshots to the root filesystem." >&2
          echo "On the droplet: mount /mnt/onym-backup-blobs, then check" >&2
          echo "the sentinel and ownership — see README 'Capacity'." >&2
          exit 1
        fi
        exec onym-backup-operator
    # Cleared so the image's CMD is not appended as an argument to the
    # guard above.
    command: []
    # Modest: the service streams chunks rather than buffering them, and
    # holds no large working set. SQLite's page cache is the only thing
    # here that grows with use.
    mem_limit: 256m
    volumes:
      # Bookkeeping — which snapshots exist, under which terms, and
      # every erasure receipt issued. Small, and losing it strands the
      # bytes: a blob with no row is swept as an orphan.
      - backup-data:/data
      # The sealed snapshots themselves, on a block volume mounted at
      # /mnt/onym-backup-blobs. A bind mount rather than a named volume
      # precisely so this cannot silently land on the root filesystem —
      # deploy.sh refuses to deploy if that path is not a mountpoint.
      #
      # This is the only copy of anyone's backup. It is not backed up
      # by anything here, and that is a gap someone must close before
      # a person who is not a tester relies on it.
      - /mnt/onym-backup-blobs:/blobs
    networks: [internal]

volumes:
  moderation-android-data:
  backup-data:
  caddy-data:
  caddy-config:
  strfry-data:
  blossom-data:
  moderation-data:
  authority-data:

networks:
  internal:
    driver: bridge
