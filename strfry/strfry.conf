##
## strfry configuration for the onym.app Nostr relay
##

db = "./strfry-db/"

dbParams {
    maxreaders = 256
    mapsize = 10995116277760
}

## Retention. There is deliberately no blanket TTL here: a device that
## lost its local store recovers by replaying this relay (see
## maxFilterLimit below), so a server-side cutoff would silently cap
## how far back a restore can reach. Lifetime is instead decided per
## event by the client, via a NIP-40 `expiration` tag. strfry enforces
## that with no configuration: it indexes the tag at ingest, hard-deletes
## expired events on a ~9s cron, and rejects an already-expired event on
## the way in. None of the knobs below are that mechanism.
## See README: "Relay retention".

events {
    maxEventSize = 65536
    # Ingest guards on created_at — NOT retention. An event already in
    # the DB is never removed by these; they only refuse new writes
    # whose claimed timestamp is >15min ahead or >3y behind.
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 94608000
    # These two are real deletion, but only for ephemeral kinds
    # (20000-29999), which strfry stores with a reserved expiration
    # sentinel and sweeps on the same cron.
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0
    realIpHeader = "x-real-ip"

    info {
        name = "onym.app relay"
        description = "Private group chat relay for onym.app"
        pubkey = ""
        contact = ""
        icon = ""
    }

    maxWebsocketPayloadSize = 131072
    autoPingSeconds = 55
    enableTcpKeepalive = false
    # The iOS client's inbox REQ carries no limit and uses stored-event
    # replay as backfill after local store loss; the default 500 cut
    # that off mid-history. See commit 2bab420.
    maxFilterLimit = 100000
    maxSubsPerConnection = 20

    writePolicy {
        plugin = ""
    }

    compression {
        enabled = true
        slidingWindow = true
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    # Sized for the droplet's 2 vCPUs, not for strfry's defaults (3/3/3/2
    # = 11 threads, which is pure contention on a small box). ingester is
    # the CPU sink — it runs secp256k1 verification on every event — and
    # reqMonitor matches each new event against every open subscription,
    # so both scale with connections rather than with cores. Raise these
    # when the droplet grows, not before. (restart required)
    numThreads {
        ingester = 2
        reqWorker = 2
        reqMonitor = 2
        negentropy = 1
    }

    negentropy {
        enabled = true
        maxSyncEvents = 1000000
    }
}
